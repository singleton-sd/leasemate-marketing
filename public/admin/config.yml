backend:
  name: github
  repo: singleton-sd/leasemate-marketing
  branch: main
  # Shared Decap OAuth on the Singleton SD API gateway; callback https://api.singletonsd.com/v1/cms-auth/callback
  base_url: https://api.singletonsd.com
  auth_endpoint: v1/cms-auth/auth

publish_mode: editorial_workflow

site_url: https://leasemate.singletonsd.com
display_url: https://leasemate.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    files:
      - label: Contact
        file: src/content/pages/contact.md
        name: contact
        fields:
          - label: Template
            name: template
            widget: hidden
            default: contact
          - label: Title
            name: title
            widget: string
            hint: Page title (browser tab / SEO).
          - label: Description
            name: description
            widget: text
            hint: Short meta description for SEO.
          - label: Headline
            name: headline
            widget: string
          - label: Summary
            name: summary
            widget: text
            hint: Hero lead / supporting sentence.
          - label: Eyebrow
            name: eyebrow
            widget: string
            required: false
          - label: Status
            name: status
            widget: string
            required: false
          - label: Submit label

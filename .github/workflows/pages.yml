# Build reads PUBLIC_* from Azure App Configuration over GitHub OIDC
# (id-token: write, no client secret). Deploy checks out for JamesIves
# (needs a git directory), downloads dist, then mints the singleton-release
# App token as its last setup step and deploys with that token only —
# never GITHUB_TOKEN.
name: Deploy production GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and type-check
        run: pnpm lint
      - name: Run tests
        run: pnpm test
      # SSD-1235 (https://app.clickup.com/t/14ymjnwcw8c) replaces this Azure
      # login and App Configuration read with the shared singleton-sd/.github
      # workflow.
      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: 4764ad98-0805-485d-8167-123cb7e90f63
          tenant-id: 9a0e57d7-e58e-4e8b-814d-037cd7d9015c
          subscription-id: 01c0bb8b-3770-4765-979a-cb13ae7e3dd2
      - name: Read PUBLIC_* from Azure App Configuration
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          # --endpoint uses the data plane. --name does an ARM lookup that
          # this identity cannot complete ("Failed to find the App
          # Configuration store").
          az appconfig kv list \
            --endpoint 'https://ssd-global-appcs-build-prod-ae.azconfig.io' \
            --auth-mode login \
            --key 'PUBLIC_*' \
            --label '\0,leasemate-marketing' \
            --resolve-keyvault false \
            --all \
            --output json \
            | node scripts/apply-appconfig-public-kv.mjs
      - name: Require Turnstile site key when lead intake is on
        run: |
          case "${PUBLIC_LEAD_INTAKE_ENABLED:-}" in
            true|TRUE|1|yes|YES) enabled=1 ;;
            *) enabled=0 ;;
          esac
          if [ "$enabled" = 1 ] && [ -z "${PUBLIC_TURNSTILE_SITE_KEY:-}" ]; then
            echo "::error::Set PUBLIC_TURNSTILE_SITE_KEY in Azure App Configuration (public site key only) before enabling PUBLIC_LEAD_INTAKE_ENABLED."
            exit 1
          fi
      - name: Build production site
        run: pnpm build
      - name: Ensure .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Install Playwright browsers
        run: pnpm playwright:install
      - name: SEO metadata checks
        run: pnpm test:seo
      - name: Accessibility checks
        run: pnpm test:a11y
      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download production dist
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: leasemate-marketing
          permission-contents: write
      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview
